<div class="relative min-h-[80vh] flex flex-col items-center justify-center p-6 bg-black overflow-hidden font-['Space_Grotesk']">
    
    <div class="absolute inset-0 bg-gradient-to-b from-primary/10 to-transparent z-0"></div>
    <div class="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-20 pointer-events-none z-0"></div>
    
    <div class="absolute inset-0 flex items-center justify-center opacity-5 select-none pointer-events-none z-0 overflow-hidden">
        <h1 class="text-[25vw] font-black italic tracking-tighter uppercase leading-none text-white whitespace-nowrap">
            RAGE CORE RAGE CORE
        </h1>
    </div>

    <div class="relative z-10 w-full max-w-md">
        <div class="bg-[#141414] border border-white/5 p-8 md:p-12 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
            
            <div class="mb-12 text-center md:text-left">
                <h2 class="text-primary font-black italic text-5xl tracking-tighter uppercase mb-2">
                    RAGE CORE
                </h2>
                <p class="text-slate-400 font-medium tracking-widest text-xs uppercase">
                    Access the underground terminal
                </p>
            </div>
            
            <form class="space-y-8" (ngSubmit)="iniciarSesion()">
                
                <div class="group relative">
                    <label class="block text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-2 group-focus-within:text-primary transition-colors" for="email">
                        Email Address
                    </label>
                    <div class="relative flex items-center">
                        <span class="material-symbols-outlined absolute left-0 text-white/30 group-focus-within:text-primary transition-colors">mail</span>
                        <input [(ngModel)]="correo" class="w-full bg-transparent border-0 border-b-2 border-white/10 py-3 pl-8 text-white focus:ring-0 focus:border-primary placeholder-white/10 transition-all font-medium" id="email" name="email" placeholder="name@domain.com" required type="email"/>
                    </div>
                </div>
                
                <div class="group relative">
                    <label class="block text-[10px] font-black uppercase tracking-[0.2em] text-slate-400 mb-2 group-focus-within:text-primary transition-colors" for="password">
                        Password
                    </label>
                    <div class="relative flex items-center">
                        <span class="material-symbols-outlined absolute left-0 text-white/30 group-focus-within:text-primary transition-colors">lock</span>
                        <input [(ngModel)]="password" class="w-full bg-transparent border-0 border-b-2 border-white/10 py-3 pl-8 text-white focus:ring-0 focus:border-primary placeholder-white/10 transition-all font-medium" id="password" name="password" placeholder="••••••••" required type="password"/>
                    </div>
                    <div class="flex justify-end mt-2">
                        <a class="text-[10px] font-bold uppercase tracking-widest text-white/40 hover:text-primary transition-colors cursor-pointer">Forgot Access?</a>
                    </div>
                </div>
                
                <div class="pt-4">
                    <button class="group relative w-full bg-primary py-5 px-8 flex items-center justify-between overflow-hidden transition-all hover:bg-primary/90 active:scale-95" type="submit">
                        <span class="relative z-10 text-white font-black uppercase tracking-tighter text-xl italic">
                            Iniciar Sesion
                        </span>
                        <span class="material-symbols-outlined relative z-10 text-white group-hover:translate-x-2 transition-transform">arrow_forward</span>
                    </button>
                </div>
            </form>
            
            <div class="mt-12 text-center">
                <a class="inline-block group cursor-pointer" routerLink="/registro">
                    <span class="text-slate-400 text-sm font-medium">¿No tienes cuenta?</span>
                    <span class="block text-primary font-black uppercase tracking-widest text-xs mt-1 group-hover:underline group-hover:underline-offset-4 transition-all">
                        Únete
                    </span>
                </a>
            </div>
        </div>

        <div class="mt-6 flex justify-between items-center px-2">
            
            <div class="text-right">
                <span class="text-[8px] font-black text-white/20 uppercase tracking-tighter">Secure Terminal</span>
                <span class="block text-[10px] font-mono text-white/40 uppercase tracking-widest">v0</span>
            </div>
        </div>
    </div>
</div>
