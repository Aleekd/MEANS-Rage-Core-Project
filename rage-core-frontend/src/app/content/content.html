<section class="relative h-[60vh] w-full overflow-hidden bg-black mb-12">
  <div class="absolute inset-0 bg-cover bg-center opacity-60" style="background-image: linear-gradient(to bottom, rgba(0,0,0,0.4), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1552346154-21d32810aba3?q=80&w=2070');"></div>
  <div class="relative flex h-full flex-col items-center justify-center text-center px-4">
    <h2 class="text-5xl md:text-7xl font-black tracking-tighter text-white uppercase">Nueva Colección</h2>
    <p class="text-lg md:text-xl font-light text-slate-300 mb-8 uppercase tracking-widest">Desata tu estilo.</p>
    <button class="bg-primary px-8 py-3 text-white font-bold uppercase hover:scale-105 transition-transform">Comprar Ahora</button>
  </div>
</section>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
    @for (product of products; track product._id) {
      <div class="group flex flex-col gap-4">
        <div class="relative aspect-[3/4] overflow-hidden bg-neutral-900 border border-white/5 group-hover:border-primary/50 transition-colors">
          <img [src]="product.imagen" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
          <button class="absolute bottom-4 right-4 bg-primary text-white p-3 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
            <span class="material-symbols-outlined">add_shopping_cart</span>
          </button>
        </div>
        <div>
          <h3 class="text-lg font-bold text-white uppercase">{{product.nombre}}</h3>
          <p class="text-primary font-bold">${{product.precio}} MXN</p>
        </div>
      </div>
    } @empty {
      <div class="col-span-full text-center py-20 border-2 border-dashed border-white/10">
        <p class="text-slate-500 uppercase tracking-[0.2em] font-bold">No hay equipo disponible en este momento.</p>
      </div>
    }
  </div>
</main>

<section class="bg-primary py-10 mt-20">
  <div class="flex justify-around text-black font-black italic text-2xl md:text-4xl overflow-hidden whitespace-nowrap">
    <span>STREET CULTURE • RAGE CORE • HIGH ATTITUDE • EST. 2024 • STREET CULTURE • RAGE CORE</span>
  </div>
</section>
