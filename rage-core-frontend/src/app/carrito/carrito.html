<main class="flex-grow max-w-7xl mx-auto w-full px-6 py-12 font-['Space_Grotesk'] text-white">
    <div class="flex flex-col lg:flex-row gap-12">
        <div class="flex-grow">
            <div class="flex items-center justify-between mb-8 pb-4 border-b border-primary/10">
                <h2 class="text-3xl font-bold uppercase tracking-tight">Tu Carrito <span class="text-primary text-lg ml-2 font-normal">[2 Items]</span></h2>
                <a class="text-sm text-slate-400 hover:text-primary underline underline-offset-4 uppercase tracking-wider cursor-pointer">Limpiar Todo</a>
            </div>

            <div class="flex flex-col md:flex-row gap-6 py-6 border-b border-primary/10 items-center">
                <div class="w-full md:w-32 aspect-square bg-[#141414] rounded overflow-hidden flex-shrink-0 border border-primary/20">
                    <img alt="Gorra Core Industrial" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-500" src="https://images.unsplash.com/photo-1588850561407-ed78c282e89b?q=80&w=400"/>
                </div>
                <div class="flex-grow grid grid-cols-1 md:grid-cols-4 gap-4 items-center w-full">
                    <div class="md:col-span-2">
                        <h3 class="font-bold text-lg uppercase leading-none mb-1">Gorra Core Industrial</h3>
                        <p class="text-slate-500 text-sm uppercase tracking-wider">Color: Negro Carbón / Talla: Única</p>
                    </div>
                    <div class="flex items-center justify-center md:justify-start">
                        <div class="flex items-center border border-primary/30 rounded">
                            <button class="px-3 py-1 hover:bg-primary/20 transition-colors"><span class="material-symbols-outlined text-sm">remove</span></button>
                            <span class="px-4 py-1 font-bold">1</span>
                            <button class="px-3 py-1 hover:bg-primary/20 transition-colors"><span class="material-symbols-outlined text-sm">add</span></button>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-xl font-bold tracking-tighter text-primary">$25.00</p>
                        <button class="text-xs text-slate-500 hover:text-primary uppercase mt-2">Eliminar</button>
                    </div>
                </div>
            </div>

            <div class="flex flex-col md:flex-row gap-6 py-6 border-b border-primary/10 items-center">
                <div class="w-full md:w-32 aspect-square bg-[#141414] rounded overflow-hidden flex-shrink-0 border border-primary/20">
                    <img alt="Camiseta Rage Oversized" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-500" src="https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?q=80&w=400"/>
                </div>
                <div class="flex-grow grid grid-cols-1 md:grid-cols-4 gap-4 items-center w-full">
                    <div class="md:col-span-2">
                        <h3 class="font-bold text-lg uppercase leading-none mb-1">Camiseta Rage Oversized</h3>
                        <p class="text-slate-500 text-sm uppercase tracking-wider">Color: Deep Red / Talla: L</p>
                    </div>
                    <div class="flex items-center justify-center md:justify-start">
                        <div class="flex items-center border border-primary/30 rounded">
                            <button class="px-3 py-1 hover:bg-primary/20 transition-colors"><span class="material-symbols-outlined text-sm">remove</span></button>
                            <span class="px-4 py-1 font-bold">2</span>
                            <button class="px-3 py-1 hover:bg-primary/20 transition-colors"><span class="material-symbols-outlined text-sm">add</span></button>
                        </div>
                    </div>
                    <div class="text-right">
                        <p class="text-xl font-bold tracking-tighter text-primary">$90.00</p>
                        <p class="text-[10px] text-slate-500">$45.00 c/u</p>
                        <button class="text-xs text-slate-500 hover:text-primary uppercase mt-1">Eliminar</button>
                    </div>
                </div>
            </div>
        </div>

        <aside class="w-full lg:w-96">
            <div class="bg-primary/5 border border-primary/20 rounded-xl p-8 sticky top-32">
                <h3 class="text-xl font-bold uppercase tracking-widest mb-6 pb-4 border-b border-primary/20">Resumen</h3>
                <div class="space-y-4 mb-8">
                    <div class="flex justify-between text-sm uppercase tracking-wider text-slate-400">
                        <span>Subtotal</span>
                        <span class="text-slate-100">$115.00</span>
                    </div>
                    <div class="flex justify-between text-sm uppercase tracking-wider text-slate-400">
                        <span>Envío</span>
                        <span class="text-slate-100">$12.00</span>
                    </div>
                    <div class="pt-4 border-t border-primary/20 flex justify-between items-end">
                        <span class="font-bold uppercase tracking-tighter text-lg">Total</span>
                        <span class="text-3xl font-bold text-primary tracking-tighter">$127.00</span>
                    </div>
                </div>

                <div class="mb-8">
                    <label class="block text-[10px] uppercase font-bold tracking-widest mb-2 text-slate-400">Cupón de Descuento</label>
                    <div class="flex gap-2">
                        <input class="bg-black border border-primary/30 rounded px-4 py-3 text-sm focus:outline-none focus:border-primary w-full uppercase placeholder:text-slate-700 text-white" placeholder="APLICAR CÓDIGO" type="text"/>
                        <button class="bg-primary hover:bg-red-700 text-white font-bold px-4 rounded transition-colors flex items-center justify-center">
                            <span class="material-symbols-outlined">chevron_right</span>
                        </button>
                    </div>
                </div>

                <button class="w-full bg-primary hover:bg-red-700 text-white py-5 rounded-lg font-black uppercase tracking-[0.2em] transition-all transform active:scale-[0.98] shadow-[0_0_20px_rgba(230,0,0,0.3)]">
                    Proceder al Pago
                </button>
            </div>
        </aside>
    </div>
</main>
