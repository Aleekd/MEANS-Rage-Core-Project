<div class="flex min-h-screen bg-black text-white font-['Space_Grotesk'] selection:bg-primary selection:text-white">
    
    <aside class="fixed left-0 top-0 h-full w-64 border-r border-white/5 bg-black flex flex-col z-50">
        <div class="p-8">
            <h1 class="text-3xl font-black italic text-primary tracking-tighter uppercase">RAGE CORE</h1>
            <p class="tracking-tighter uppercase font-bold text-white/40 text-xs mt-1">ADMIN SYSTEM</p>
        </div>
        
        <nav class="flex-1 mt-4 flex flex-col gap-1">
            <a routerLink="/admin/dashboard" routerLinkActive="text-primary border-l-4 border-primary bg-primary/5 scale-105" [routerLinkActiveOptions]="{exact: true}" class="text-white/60 hover:text-white py-4 px-6 flex items-center gap-4 transition-all duration-200 tracking-tighter uppercase font-bold hover:bg-white/5 cursor-pointer origin-left">
                <span class="material-symbols-outlined">dashboard</span>
                <span>Dashboard</span>
            </a>
            <a routerLink="/admin/ordenes" routerLinkActive="text-primary border-l-4 border-primary bg-primary/5 scale-105" class="text-white/60 hover:text-white py-4 px-6 flex items-center gap-4 transition-all duration-200 tracking-tighter uppercase font-bold hover:bg-white/5 cursor-pointer origin-left">
                <span class="material-symbols-outlined">shopping_cart</span>
                <span>Ordenes</span>
            </a>
            <a routerLink="/admin/cupones" routerLinkActive="text-primary border-l-4 border-primary bg-primary/5 scale-105" class="text-white/60 hover:text-white py-4 px-6 flex items-center gap-4 transition-all duration-200 tracking-tighter uppercase font-bold hover:bg-white/5 cursor-pointer origin-left">
                <span class="material-symbols-outlined">confirmation_number</span>
                <span>Cupones</span>
            </a>
            <a routerLink="/admin/usuarios" routerLinkActive="text-primary border-l-4 border-primary bg-primary/5 scale-105" class="text-white/60 hover:text-white py-4 px-6 flex items-center gap-4 transition-all duration-200 tracking-tighter uppercase font-bold hover:bg-white/5 cursor-pointer origin-left">
                <span class="material-symbols-outlined">group</span>
                <span>Usuarios</span>
            </a>
            <a routerLink="/admin/productos" routerLinkActive="text-primary border-l-4 border-primary bg-primary/5 scale-105" class="text-white/60 hover:text-white py-4 px-6 flex items-center gap-4 transition-all duration-200 tracking-tighter uppercase font-bold hover:bg-white/5 cursor-pointer origin-left">
                <span class="material-symbols-outlined">add_box</span>
                <span>Agregar Producto</span>
            </a>
        </nav>
        
        <div class="mt-auto border-t border-white/5 p-6">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-10 h-10 bg-neutral-900 flex items-center justify-center border border-white/10">
                    <span class="material-symbols-outlined text-white/50">admin_panel_settings</span>
                </div>
                <div>
                    <div class="text-xs font-bold text-white uppercase tracking-widest">Admin</div>
                    <div class="text-[10px] text-primary uppercase font-black">System Status: Active</div>
                </div>
            </div>
            <a class="text-white/60 hover:text-white py-2 flex items-center gap-4 transition-colors text-sm uppercase font-bold tracking-tighter cursor-pointer" routerLink="/">
                <span class="material-symbols-outlined text-sm">logout</span>
                <span>Volver a Tienda</span>
            </a>
        </div>
    </aside>

    <main class="ml-64 flex-1 flex flex-col min-h-screen">
        
        <header class="bg-black/80 backdrop-blur-md flex justify-between items-center w-full px-8 h-20 border-b border-white/10 sticky top-0 z-40">
            <div class="text-xl font-black text-white tracking-tight">RAGE CORE ADMIN</div>
            <div class="flex items-center gap-6">
                <div class="relative group hidden lg:block">
                    <input class="bg-neutral-900 border-none focus:ring-1 focus:ring-primary text-xs py-2 pl-10 pr-4 w-64 font-bold tracking-tighter uppercase text-white placeholder:text-white/40" placeholder="SEARCH SYSTEM..." type="text"/>
                    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-white/40 text-sm">search</span>
                </div>
                <button class="text-white/80 hover:text-primary transition-colors">
                    <span class="material-symbols-outlined">notifications</span>
                </button>
            </div>
        </header>

        <div class="flex-1 flex flex-col relative">
            <router-outlet></router-outlet>
        </div>

    </main>
</div>
