<div class="p-8 md:p-12 lg:p-16 max-w-7xl mx-auto w-full">
    <div class="mb-16 relative">
        <h2 class="text-6xl md:text-8xl font-black tracking-tighter uppercase italic leading-none">
            AÑADIR <span class="text-primary">PRODUCTO</span>
        </h2>
        <div class="h-1 w-32 bg-primary mt-4"></div>
        <p class="mt-6 text-white/40 uppercase tracking-[0.3em] text-sm font-bold italic">Reabastecimiento de inventario</p>
    </div>

    <form class="grid grid-cols-1 lg:grid-cols-12 gap-8" (ngSubmit)="onSave()">
        <div class="lg:col-span-5 space-y-8">
            <div class="relative aspect-[3/4] bg-[#141414] overflow-hidden group border border-white/5">
                <div class="absolute inset-0 flex flex-col items-center justify-center p-8 border-2 border-dashed border-white/10 group-hover:border-primary/50 m-4 transition-colors">
                    <span class="material-symbols-outlined text-5xl text-white/20 group-hover:text-primary mb-4">cloud_upload</span>
                    <p class="text-xs font-black tracking-widest uppercase text-white/40 group-hover:text-white">Pega la URL del Producto Aquí</p>
                    <input class="w-full mt-4 bg-black border border-white/10 p-2 text-white/60 text-xs" placeholder="https://imagen..." type="text"/>
                </div>
            </div>
        </div>

        <div class="lg:col-span-7 flex flex-col gap-8">
            <div class="bg-[#141414] p-8 space-y-8 border-l-4 border-primary">
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase tracking-[0.2em] text-primary">Nombre del Producto</label>
                    <input class="w-full bg-black border border-white/10 p-4 text-xl font-black italic tracking-tight uppercase text-white focus:border-primary transition-all outline-none" placeholder="EJ. SUDADERA 'OBSIDIAN_CORE'" type="text"/>
                </div>
                <div class="space-y-2">
                    <label class="text-[10px] font-black uppercase tracking-[0.2em] text-white/60">Categoría / Color</label>
                    <input class="w-full bg-black border border-white/10 p-4 text-sm font-medium tracking-tight uppercase text-white focus:border-primary transition-all outline-none" placeholder="SUDADERA | NEGRO" type="text"/>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="bg-[#141414] p-8 space-y-2 border-l-4 border-white/20">
                    <label class="text-[10px] font-black uppercase tracking-[0.2em] text-white/60">Precio ($ MXN)</label>
                    <div class="flex items-center gap-4">
                        <span class="text-2xl font-black italic text-primary">$</span>
                        <input class="w-full bg-transparent border-none p-0 text-3xl font-black italic tracking-tighter text-white focus:ring-0 outline-none" placeholder="00.00" type="number"/>
                    </div>
                </div>
                <div class="bg-[#141414] p-8 space-y-2 border-l-4 border-white/20">
                    <label class="text-[10px] font-black uppercase tracking-[0.2em] text-white/60">Stock Inicial</label>
                    <div class="flex items-center gap-4">
                        <span class="material-symbols-outlined text-white/20">inventory_2</span>
                        <input class="w-full bg-transparent border-none p-0 text-3xl font-black italic tracking-tighter text-white focus:ring-0 outline-none" placeholder="0" type="number"/>
                    </div>
                </div>
            </div>

            <div class="mt-8 flex flex-col sm:flex-row gap-4">
                <button class="flex-1 bg-primary text-white py-6 text-xl font-black italic tracking-tighter uppercase flex items-center justify-center gap-4 hover:bg-primary/80 transition-all transform hover:-translate-y-1" type="submit">
                    <span class="material-symbols-outlined">rocket_launch</span> Guardar Producto
                </button>
            </div>
        </div>
    </form>
</div>
