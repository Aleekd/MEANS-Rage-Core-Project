<div class="max-w-5xl mx-auto">
    <div class="mb-12">
        <p class="text-primary font-bold italic tracking-[0.3em] mb-2 text-sm">PROTECCIÓN DE ACCESO</p>
        <h1 class="text-5xl md:text-7xl font-black tracking-tighter uppercase text-white leading-none">
            SEGURIDAD <span class="text-primary">DE LA CUENTA</span>
        </h1>
        <div class="h-1 w-24 bg-primary mt-4"></div>
    </div>
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-7 bg-[#141414] p-8 border-l-4 border-primary">
            <h3 class="text-2xl font-black mb-8 italic uppercase tracking-tight">Actualizar Credenciales</h3>
            <form class="space-y-6">
                <div>
                    <label class="block text-[10px] font-bold text-white/60 uppercase tracking-widest mb-2">Contraseña Actual</label>
                    <input class="w-full bg-[#1f1f1f] border-none text-white focus:ring-1 focus:ring-primary h-14 px-4 font-mono outline-none" placeholder="••••••••" type="password"/>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-bold text-white/60 uppercase tracking-widest mb-2">Nueva Contraseña</label>
                        <input class="w-full bg-[#1f1f1f] border-none text-white focus:ring-1 focus:ring-primary h-14 px-4 font-mono outline-none" placeholder="••••••••" type="password"/>
                    </div>
                </div>
                <div class="pt-4">
                    <button class="w-full bg-primary py-5 px-8 flex items-center justify-center font-black uppercase italic text-xl hover:bg-primary/80 transition-colors">
                        ACTUALIZAR SEGURIDAD
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
