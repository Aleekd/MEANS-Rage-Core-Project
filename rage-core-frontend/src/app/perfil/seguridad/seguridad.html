<div class="max-w-5xl mx-auto relative">
    <div class="mb-12">
        <p class="text-primary font-bold italic tracking-[0.3em] mb-2 text-sm">PROTECCIÓN DE ACCESO</p>
        <h1 class="text-5xl md:text-7xl font-black tracking-tighter uppercase text-white leading-none">
            SEGURIDAD <span class="text-primary">DE LA CUENTA</span>
        </h1>
        <div class="h-1 w-24 bg-primary mt-4"></div>
    </div>
    
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
        <div class="lg:col-span-7 bg-[#141414] p-8 border-l-4 border-primary">
            <h3 class="text-2xl font-black mb-8 italic uppercase tracking-tight">Actualizar Credenciales</h3>
            
            <form class="space-y-6" (ngSubmit)="cambiarContrasena()">
                
                <div *ngIf="mostrarError" class="bg-red-900/50 border border-red-500 text-white px-4 py-2 text-xs font-bold uppercase tracking-widest">
                    {{ mensajeError }}
                </div>

                <div>
                    <label class="block text-[10px] font-bold text-white/60 uppercase tracking-widest mb-2">Contraseña Actual</label>
                    <input [(ngModel)]="passwords.actual" name="actual" class="w-full bg-[#1f1f1f] border-none text-white focus:ring-1 focus:ring-primary h-14 px-4 font-mono outline-none" placeholder="••••••••" type="password"/>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-[10px] font-bold text-white/60 uppercase tracking-widest mb-2">Nueva Contraseña</label>
                        <input [(ngModel)]="passwords.nueva" name="nueva" class="w-full bg-[#1f1f1f] border-none text-white focus:ring-1 focus:ring-primary h-14 px-4 font-mono outline-none" placeholder="••••••••" type="password"/>
                    </div>
                </div>
                <div class="pt-4">
                    <button type="submit" class="w-full bg-primary py-5 px-8 flex items-center justify-center font-black uppercase italic text-xl hover:bg-primary/80 transition-colors">
                        ACTUALIZAR SEGURIDAD
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div *ngIf="mostrarModalExito" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/80 backdrop-blur-sm px-4 transition-opacity duration-300">
        <div class="bg-[#141414] border-2 border-primary p-8 max-w-sm w-full shadow-[0_0_40px_rgba(255,0,0,0.15)] text-center relative overflow-hidden animate-fade-in-up">
            <div class="absolute top-0 left-0 w-full h-1 bg-primary"></div>
            <span class="material-symbols-outlined text-primary text-6xl mb-4">lock</span>
            <h3 class="text-white font-black text-3xl uppercase tracking-tighter italic mb-2">
                SEGURIDAD<br>REFORZADA
            </h3>
            <p class="text-zinc-400 text-[10px] uppercase tracking-[0.2em] mb-8 font-bold">
                Tu nueva contraseña ha sido encriptada y guardada exitosamente.
            </p>
            <button (click)="mostrarModalExito = false" class="w-full bg-white text-black font-black py-4 uppercase tracking-[0.3em] text-xs hover:bg-primary hover:text-white transition-all duration-300 border-b-4 border-zinc-400 hover:border-red-900">
                CONTINUAR
            </button>
        </div>
    </div>
</div>
